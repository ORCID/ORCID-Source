name: test_mvn

permissions:
  checks: write
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      version_tag:
        description: 'Name of the tag to build'
        required: false
        default: 'latest'
        type: string
      bump:
        description: 'whether to bump the version number by a major minor patch amount or none'
        required: false
        default: 'patch'
        type: string
      ref:
        description: 'git reference to use with the checkout use default_branch to have that calculated'
        required: false
        default: "default"
        type: string
      seed_maven_cache:
        description: Whether to seed cache
        type: boolean
        required: false
        default: true
      install_maven_dependencies:
        description: Whether to install dependencies or use a previous cache
        type: boolean
        required: false
        default: true
      java_version:
        description: 'JDK version to build with'
        required: false
        default: '21'
        type: string

  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Name of the tag to build'
        required: false
        default: 'latest'
        type: string
      bump:
        description: 'whether to bump the version number by a major minor patch amount or none'
        required: false
        default: 'patch'
        type: string
      ref:
        description: 'git reference to use with the checkout use default_branch to have that calculated'
        required: false
        default: "default"
        type: string
      seed_maven_cache:
        description: Whether to seed cache
        type: boolean
        required: false
        default: true
      install_maven_dependencies:
        description: Whether to install dependencies or use a previous cache
        type: boolean
        required: false
        default: true
      java_version:
        description: 'JDK version to build with'
        required: false
        default: '21'
        type: choice
        options:
          - '11'
          - '21'


jobs:
  test_mvn:
    strategy:
      matrix:
        include:
          - project: orcid-message-listener
          - project: orcid-activemq
          - project: orcid-api-web
          - project: orcid-internal-api
          - project: orcid-pub-web
          - project: orcid-scheduler-web
          - project: orcid-web
          - project: orcid-utils
          - project: orcid-core
          - project: orcid-persistence
          - project: orcid-api-common

    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: git-checkout-ref-action
        id: ref
        uses: ORCID/git-checkout-ref-action@4258c0cbe4b164e410d0263416034787fb300f26 # main
        with:
          default_branch: ${{ github.event.repository.default_branch }}
          ref: ${{ inputs.ref }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # checkout some history so we can scan commits for bump messages
          # NOTE: history does not include tags!
          fetch-depth: 100

      - name: find next version
        id: version
        uses: ORCID/version-bump-action@75233259407ae3728171973d09bc66fcf4b15b6a # main
        with:
          version_tag: ${{ inputs.version_tag }}
          bump: ${{ inputs.bump }}

      - name: Set up Open JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java_version }}

########################################################################################
# handle restoring a custom gha cache

      - name: if not installing dependencies restore special previous git_sha cache
        if:  ${{ ! inputs.install_maven_dependencies }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ steps.version.outputs.version_tag_numeric }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ steps.version.outputs.version_tag_numeric }}-${{ github.sha }}

      - name: bump version of the parent pom and connected projects
        if: ${{ ! inputs.install_maven_dependencies }}
        run: |
          mvn -T 1C --batch-mode versions:set -DskipTests \
              -DnewVersion="$version_tag_numeric" -DgenerateBackupPoms=false
        env:
          version_tag_numeric: "${{ steps.version.outputs.version_tag_numeric }}"

########################################################################################

      - name: if installing dependencies use a standard cache key name
        if: ${{ inputs.install_maven_dependencies }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-seed-cache
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-seed-cache

      - name: seed_maven_cache
        if: ${{ inputs.seed_maven_cache }}
        id: cache
        uses: ORCID/ORCID-Source-cache-action@9831e0ffb2e9db46bffa6bb55fb897d159da5668 # main
        with:
          version_tag_numeric: ${{ steps.version.outputs.version_tag_numeric }}

      - name: install_dependencies and bump version
        if: ${{ inputs.install_maven_dependencies }}
        id: install_dependencies
        uses: ORCID/ORCID-Source-dependencies-action@e470d485ef8dc69858100998d77d03ccefb06ef1 # main
        with:
          version_tag_numeric: ${{ steps.version.outputs.version_tag_numeric }}

########################################################################################
      - name: "Test ${{ matrix.project }}"
        run: |
          mvn -T 1C --batch-mode test \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
              --projects ${{ matrix.project }} --fail-at-end

      - name: Collect coverage and test reports
        if: always()
        run: |
          mkdir -p artifact/surefire
          cp "$project/target/site/jacoco/jacoco.xml" artifact/ 2>/dev/null || \
            echo "no jacoco.xml for $project (tests may have failed before the report ran)"
          cp "$project"/target/surefire-reports/TEST-*.xml artifact/surefire/ 2>/dev/null || \
            echo "no surefire reports for $project"
        env:
          project: "${{ matrix.project }}"

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.project }}
          path: artifact
          # warn, not ignore, for the same reason as the database stage below: an
          # artifact that never uploads makes the module vanish from the table
          # rather than showing up as a module whose report is missing.
          if-no-files-found: warn
          retention-days: 7

      - name: Publish unit test report for non forked repo
        if: ${{ failure() && (github.event.pull_request.head.repo.full_name == github.repository) }} # only report if a test has failed and we are a non forked repo
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: "Unit test report for ${{ matrix.project }}"
          path: ${{ matrix.project }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Annotate only test report for forked repo
        uses: mikepenz/action-junit-report@ec3a351c13e080dc4fa94c49ab7ad5bf778a9668 # v5
        if: ${{ failure() &&  (github.event.pull_request.head.repo.full_name != github.repository) }} # only report if a test has failed and we are a forked repo
        with:
          report_paths: ${{ matrix.project }}/target/surefire-reports/*.xml
          annotate_only: true # forked repo cannot write to checks so just do annotations

  db_tests:
    # The tests that genuinely need a database, marked
    # @Category(org.orcid.test.DatabaseTest.class). They are excluded from the
    # unit matrix above, so this job is where they run -- beside it rather than
    # inside its slowest members.
    #
    # A matrix, for the same reason the unit stage is one: run sequentially over
    # every module this stage took 6m10s of Maven, which made the database job
    # the thing the whole pull request waited on. Per module the worst is
    # orcid-core at 2m23s of local Maven. What a matrix repeats per job is the
    # whole pre-Maven setup, measured across a real run at 87s to 127s, median
    # 102s -- real, but paid in parallel, where the single job's 6m10s was not.
    #
    # Only the modules that hold database tests are listed: the other five would
    # each pay that setup to run nothing. The `db_stage_drift` job below fails
    # if a module outside this list ever gains one, so the saving cannot turn
    # into a silently skipped test.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: orcid-message-listener
          - project: orcid-activemq
          - project: orcid-api-web
          - project: orcid-web
          - project: orcid-core
          - project: orcid-persistence

    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: git-checkout-ref-action
        id: ref
        uses: ORCID/git-checkout-ref-action@4258c0cbe4b164e410d0263416034787fb300f26 # main
        with:
          default_branch: ${{ github.event.repository.default_branch }}
          ref: ${{ inputs.ref }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 100

      - name: find next version
        id: version
        uses: ORCID/version-bump-action@75233259407ae3728171973d09bc66fcf4b15b6a # main
        with:
          version_tag: ${{ inputs.version_tag }}
          bump: ${{ inputs.bump }}

      - name: Set up Open JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java_version }}

      - name: restore maven cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-seed-cache
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-seed-cache

      - name: seed_maven_cache
        if: ${{ inputs.seed_maven_cache }}
        uses: ORCID/ORCID-Source-cache-action@9831e0ffb2e9db46bffa6bb55fb897d159da5668 # main
        with:
          version_tag_numeric: ${{ steps.version.outputs.version_tag_numeric }}

      - name: install_dependencies and bump version
        if: ${{ inputs.install_maven_dependencies }}
        uses: ORCID/ORCID-Source-dependencies-action@e470d485ef8dc69858100998d77d03ccefb06ef1 # main
        with:
          version_tag_numeric: ${{ steps.version.outputs.version_tag_numeric }}

      - name: Run database tests
        run: |
          mvn -T 1C --batch-mode test -P db-tests \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
              --projects ${{ matrix.project }} --fail-at-end

      - name: Collect database-stage coverage
        if: always()
        run: |
          mkdir -p db-artifact
          cp "${{ matrix.project }}/target/site/jacoco/jacoco.xml" db-artifact/ 2>/dev/null || \
            echo "no jacoco.xml for ${{ matrix.project }} (tests may have failed before the report ran)"

      - name: Upload database-stage coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-db-${{ matrix.project }}
          path: db-artifact
          # warn, not ignore: an empty artifact still reaches coverage_report, which
          # renders "no report" for a leg that died before JaCoCo ran. Ignoring it
          # would upload nothing and read as "this module has no database tests".
          if-no-files-found: warn
          retention-days: 7

      - name: Publish database test report
        if: ${{ failure() && (github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: "Database test report for ${{ matrix.project }}"
          path: ${{ matrix.project }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  db_stage_drift:
    # The database matrix lists only the modules that hold database tests, so a
    # module gaining its first one would otherwise stop running it silently --
    # the same shape of failure the migration itself was written to avoid.
    # Cheap enough to run on every pull request.
    #
    # It assumes the @Category is written in the module that owns the test.
    # JUnit inherits categories, so an annotated base class in another module
    # would defeat it; that is safe today because every `extends BaseTest` is
    # inside orcid-core, no module depends on orcid-core's test jar, and the
    # cross-module base orcid-test/.../DBUnitTest.java is deliberately not
    # annotated. Revisit if DBUnitTest ever is.
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: git-checkout-ref-action
        id: ref
        uses: ORCID/git-checkout-ref-action@4258c0cbe4b164e410d0263416034787fb300f26 # main
        with:
          default_branch: ${{ github.event.repository.default_branch }}
          ref: ${{ inputs.ref }}

      - name: Run actions/checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Every module holding a database test must be in the db_tests matrix
        run: |
          # Both lists are read from the files the build itself reads, so the
          # guard cannot drift from the thing it guards.
          in_matrix=$(sed -n '/^  db_tests:/,/^  db_stage_drift:/p' .github/workflows/test_mvn.yml \
                      | sed -n 's/^ *- project: //p' | tr '\n' ' ')
          reactor=$(sed -n '/<modules>/,/<\/modules>/p' pom.xml \
                    | sed -n 's/.*<module>\(.*\)<\/module>.*/\1/p')
          echo "matrix: $in_matrix"
          drift=0
          for m in $reactor; do
            [ -d "$m/src/test" ] || continue
            if grep -rlqE '^[[:space:]]*@Category\([^)]*DatabaseTest\.class' "$m/src/test"; then
              case " $in_matrix " in
                *" $m "*) ;;
                *) echo "::error::$m has @Category(DatabaseTest.class) tests but is not in the db_tests matrix, so they never run. Add it."; drift=1 ;;
              esac
            else
              case " $in_matrix " in
                *" $m "*) echo "::warning::$m is in the db_tests matrix but has no database tests; it costs ~100s of setup to run nothing and can be dropped." ;;
              esac
            fi
          done
          if [ "$drift" -eq 0 ]; then
            echo "database stage matrix covers every module that needs it"
          fi
          exit $drift

  coverage_report:
    # Renders the JaCoCo results the matrix produced. Measures only: no
    # thresholds, and this job never fails the build.
    needs: [test_mvn, db_tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage

      - name: List changed files
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$base"
          git diff --name-only "origin/$base"...HEAD > changed-files.txt || : > changed-files.txt
          wc -l < changed-files.txt
        env:
          base: ${{ github.base_ref }}

      - name: Render report
        run: |
          if [ -f changed-files.txt ]; then
            python3 .github/scripts/coverage_report.py coverage \
              --changed-files changed-files.txt > coverage-report.md
          else
            python3 .github/scripts/coverage_report.py coverage > coverage-report.md
          fi
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # Same-repo pull requests get the report as a comment, created once and
      # updated in place on later pushes. Forked pull requests cannot be
      # commented on with a read-only token; the step summary above is their
      # copy, so nothing is lost and nothing fails.
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- orcid-coverage-report -->"))) | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@coverage-report.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@coverage-report.md
          fi
