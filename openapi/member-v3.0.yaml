  securitySchemes:
    orcid_auth:
      description: "Send the access token as `Authorization: Bearer <token>`. Tokens\
        \ that act on a record come from the authorization code flow, after its owner\
        \ grants access; other tokens come from client credentials. Only member clients\
        \ can use this API."
      flows:
        authorizationCode:
          authorizationUrl: https://orcid.org/oauth/authorize
          scopes:
            /activities/update: "Add, update and delete the activities this client\
              \ is the source of."
            /authenticate: Read the user's ORCID iD and the record's public data.
            /person/update: "Add, update and delete the person items this client is\
              \ the source of."
            /read-limited: "Read the items the record owner shares with trusted parties,\
              \ and the public ones."
            openid: Sign the user in with OpenID Connect; the token response carries
              an ID token.
          tokenUrl: https://orcid.org/oauth/token
        clientCredentials:
          scopes:
            /group-id-record/read: Read group IDs.
            /group-id-record/update: "Create, update and delete group IDs."
            /premium-notification: Send permission notifications.
            /read-public: "Read public items only, from any record."
            /webhook: Register and unregister webhooks.
          tokenUrl: https://orcid.org/oauth/token
      type: oauth2
