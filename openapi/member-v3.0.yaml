openapi: 3.0.3
info:
  description: Read and update ORCID records on behalf of their owners. Generated
    from the Registry's source; do not edit the generated file by hand.
  license:
    name: MIT
    url: https://github.com/ORCID/ORCID-Source/blob/main/LICENSE
  title: ORCID Member API
  version: "3.0"
servers:
- description: Production
  url: https://api.orcid.org
- description: Sandbox
  url: https://api.sandbox.orcid.org
tags:
- description: "The whole record, person section and activity summaries together."
  name: Record
- description: Counts and highlights of the record's public items.
  name: Record summary
- description: The person section in one read.
  name: Person
- description: Names and biography.
  name: Personal details
- description: The record owner's biography. Read only.
  name: Biography
- description: Other names the record owner is known by.
  name: Other names
- description: Links to the record owner's pages elsewhere.
  name: Researcher URLs
- description: Keywords that describe the record owner's work.
  name: Keywords
- description: Countries the record owner is associated with.
  name: Addresses
- description: The record owner's email addresses. Read only.
  name: Emails
- description: "The record owner's identifiers in other systems, such as a Scopus\
    \ Author ID."
  name: External identifiers
- description: Summaries of every activity section in one read.
  name: Activities
- description: "Research outputs, such as articles, datasets and software."
  name: Works
- description: "Grants, awards and other funding."
  name: Fundings
- description: Affiliations of type education.
  name: Education
- description: Affiliations of type employment.
  name: Employment
- description: Affiliations of type qualification.
  name: Qualification
- description: Affiliations of type invited position.
  name: Invited position
- description: Affiliations of type distinction.
  name: Distinction
- description: Affiliations of type membership.
  name: Membership
- description: Affiliations of type service.
  name: Service
- description: "Peer review activity, grouped by the group ID of what was reviewed."
  name: Peer reviews
- description: "Facilities, collections and other resources the record owner used."
  name: Research resources
- description: "Permission notifications, which ask the record owner to connect with\
    \ an integration."
  name: Notifications
- description: "Group IDs that peer reviews are grouped by, such as a journal's ISSN."
  name: Group IDs
- description: Public details of an API client.
  name: Clients
- description: Search the registry with Solr query syntax.
  name: Search
- description: Ask the registry to notify a URI when a record changes.
  name: Webhooks
paths:
  /v3.0/client/{client_id}:
    get:
      operationId: viewClient
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
          pattern: "[^/]+"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/xml:
              schema:
                $ref: "#/components/schemas/ClientSummary"
          description: Fetch client details
        "401":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The token is invalid, expired or revoked (an OAuth error,\
            \ always JSON), or it belongs to a public client or to another record\
            \ (error 9017)."
        "403":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No token was sent (an OAuth error, always JSON), or the token\
            \ lacks the scope this needs (error 9038)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No record has this iD, or no item has this put-code (error\
            \ 9016)."
      security:
      - orcid_auth:
        - /read-public
      summary: Fetch client details
      tags:
      - Clients
  /v3.0/csv-search:
    get:
      operationId: searchByQueryCSV
      parameters:
      - description: Offset of the first result (0-based).
        in: query
        name: start
        schema:
          type: integer
          format: int64
      - description: Number of results to return (maximum 1000).
        in: query
        name: rows
        schema:
          type: integer
          format: int64
      - description: "Comma-separated fields to return, for example `orcid,given-names,family-name`."
        in: query
        name: fl
        schema:
          type: string
      - description: "Solr query, for example `family-name:Carberry` or `doi-self:10.1087/20120404`."
        in: query
        name: q
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
          description: "One row per result, with the requested fields"
        "400":
          content:
            text/csv:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The start or rows parameter is out of range (rows 1,000 at\
            \ most; start 10,000 at most without a token)"
        "401":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The token is invalid, expired or revoked (an OAuth error,\
            \ always JSON), or it belongs to a public client or to another record\
            \ (error 9017)."
        "403":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No token was sent (an OAuth error, always JSON), or the token\
            \ lacks the scope this needs (error 9038)."
      security:
      - orcid_auth:
        - /read-public
      summary: Search records
      tags:
      - Search
  /v3.0/expanded-search:
    get:
      operationId: expandedSearchByQuery
      parameters:
      - description: Offset of the first result (0-based).
        in: query
        name: start
        schema:
          type: integer
          format: int64
      - description: Number of results to return (maximum 1000).
        in: query
        name: rows
        schema:
          type: integer
          format: int64
      - description: "Solr query, for example `family-name:Carberry` or `doi-self:10.1087/20120404`."
        in: query
        name: q
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/xml:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
          description: "Matching records with their names, emails and institutions"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The start or rows parameter is out of range (rows 1,000 at\
            \ most; start 10,000 at most without a token)"
        "401":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The token is invalid, expired or revoked (an OAuth error,\
            \ always JSON), or it belongs to a public client or to another record\
            \ (error 9017)."
        "403":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No token was sent (an OAuth error, always JSON), or the token\
            \ lacks the scope this needs (error 9038)."
      security:
      - orcid_auth:
        - /read-public
      summary: Search records
      tags:
      - Search
  /v3.0/group-id-record:
    get:
      operationId: viewGroupIdRecords
      parameters:
      - in: query
        name: page-size
        schema:
          type: string
          default: "100"
      - in: query
        name: page
        schema:
          type: string
          default: "1"
      - description: Name of a single group-id record to fetch.
        in: query
        name: name
        schema:
          type: string
      - description: "Group ID of a single record to fetch, for example `issn:0000-0001`."
        in: query
        name: group-id
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/GroupIdRecords"
                - $ref: "#/components/schemas/GroupIdRecord"
            application/orcid+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/GroupIdRecords"
                - $ref: "#/components/schemas/GroupIdRecord"
            application/orcid+xml:
              schema:
                oneOf:
                - $ref: "#/components/schemas/GroupIdRecords"
                - $ref: "#/components/schemas/GroupIdRecord"
            application/vnd.orcid+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/GroupIdRecords"
                - $ref: "#/components/schemas/GroupIdRecord"
            application/vnd.orcid+xml:
              schema:
                oneOf:
                - $ref: "#/components/schemas/GroupIdRecords"
                - $ref: "#/components/schemas/GroupIdRecord"
            application/xml:
              schema:
                oneOf:
                - $ref: "#/components/schemas/GroupIdRecords"
                - $ref: "#/components/schemas/GroupIdRecord"
          description: A page of group-id records; one record when `group-id` or `name`
            is given
        "401":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The token is invalid, expired or revoked (an OAuth error,\
            \ always JSON), or it belongs to a public client or to another record\
            \ (error 9017)."
        "403":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No token was sent (an OAuth error, always JSON), or the token\
            \ lacks the scope this needs (error 9038)."
      security:
      - orcid_auth:
        - /group-id-record/read
      summary: Fetch Groups
      tags:
      - Group IDs
    post:
      operationId: createGroupIdRecord
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupIdRecord"
          application/orcid+json:
            schema:
              $ref: "#/components/schemas/GroupIdRecord"
          application/orcid+xml:
            schema:
              $ref: "#/components/schemas/GroupIdRecord"
          application/vnd.orcid+json:
            schema:
              $ref: "#/components/schemas/GroupIdRecord"
          application/vnd.orcid+xml:
            schema:
              $ref: "#/components/schemas/GroupIdRecord"
          application/xml:
            schema:
              $ref: "#/components/schemas/GroupIdRecord"
      responses:
        "201":
          description: "Group created, see HTTP Location header for URI"
          headers:
            Location:
              description: URI of the new item
              schema:
                type: string
                format: uri
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            text/plain:
              schema:
                type: string
          description: "Bad request: the body does not match the schema (error 9047)\
            \ or holds an invalid value. Malformed JSON is answered with the parser's\
            \ message, as plain text."
        "401":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The token is invalid, expired or revoked (an OAuth error,\
            \ always JSON), or it belongs to a public client or to another record\
            \ (error 9017)."
        "403":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No token was sent (an OAuth error, always JSON), or the token\
            \ lacks the scope this needs (error 9038)."
      security:
      - orcid_auth:
        - /group-id-record/update
      summary: Create a Group
      tags:
      - Group IDs
  /v3.0/group-id-record/{putCode}:
    delete:
      operationId: deleteGroupIdRecord
      parameters:
      - description: "Put-code of the item: the identifier the API gave it when it\
          \ was added."
        in: path
        name: putCode
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Group deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "Bad request: the put-code is not a number (9034)."
        "401":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The token is invalid, expired or revoked (an OAuth error,\
            \ always JSON), or it belongs to a public client or to another record\
            \ (error 9017)."
        "403":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No token was sent (an OAuth error, always JSON), or the token\
            \ lacks the scope this needs (error 9038)."
      security:
      - orcid_auth:
        - /group-id-record/update
      summary: Delete a Group
      tags:
      - Group IDs
    get:
      operationId: viewGroupIdRecord
      parameters:
      - description: "Put-code of the item: the identifier the API gave it when it\
          \ was added."
        in: path
        name: putCode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupIdRecord"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/GroupIdRecord"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/GroupIdRecord"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/GroupIdRecord"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/GroupIdRecord"
            application/xml:
              schema:
                $ref: "#/components/schemas/GroupIdRecord"
          description: Fetch a Group
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: No group ID record has this put-code (error 9026)
        "401":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The token is invalid, expired or revoked (an OAuth error,\
            \ always JSON), or it belongs to a public client or to another record\
            \ (error 9017)."
        "403":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/OrcidError"
                - $ref: "#/components/schemas/OAuthError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
