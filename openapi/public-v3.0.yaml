  securitySchemes:
    orcid_auth:
      description: "A token is optional. Requests without one are accepted up to a\
        \ daily quota per IP address; requests with a token are not held to that quota.\
        \ Send it as `Authorization: Bearer <token>`."
      flows:
        authorizationCode:
          authorizationUrl: https://orcid.org/oauth/authorize
          scopes:
            /authenticate: Read the user's ORCID iD; the token also reads public data.
            openid: Sign the user in with OpenID Connect; the token response carries
              an ID token.
          tokenUrl: https://orcid.org/oauth/token
        clientCredentials:
          scopes:
            /read-public: Read public data.
          tokenUrl: https://orcid.org/oauth/token
      type: oauth2
