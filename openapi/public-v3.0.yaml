            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: The record is deprecated. Location is this URL with the primary
            record's iD.
          headers:
            Location:
              description: The same resource on the primary record
              schema:
                type: string
                format: uri
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: "The token is unknown, expired or revoked. The token is optional,\
            \ but a bad one is refused."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No record has this iD, or no item has this put-code (error\
            \ 9016)."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The record is locked (error 9018), deactivated (9044), or\
            \ unclaimed and still in its claim period (9036)."
      summary: Fetch the record
      tags:
      - Record
