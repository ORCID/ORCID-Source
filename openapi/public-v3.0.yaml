openapi: 3.0.3
info:
  description: Read public ORCID record data and search the registry. Generated from
    the Registry's source; do not edit the generated file by hand.
  license:
    name: MIT
    url: https://github.com/ORCID/ORCID-Source/blob/main/LICENSE
  title: ORCID Public API
  version: "3.0"
servers:
- description: Production
  url: https://pub.orcid.org
- description: Sandbox
  url: https://pub.sandbox.orcid.org
security:
- {}
- orcid_auth:
  - /read-public
tags:
- description: "The whole record, person section and activity summaries together."
  name: Record
- description: The person section in one read.
  name: Person
- description: Names and biography.
  name: Personal details
- description: The record owner's biography.
  name: Biography
- description: Other names the record owner is known by.
  name: Other names
- description: Links to the record owner's pages elsewhere.
  name: Researcher URLs
- description: Keywords that describe the record owner's work.
  name: Keywords
- description: Countries the record owner is associated with.
  name: Addresses
- description: The record owner's public email addresses.
  name: Emails
- description: "The record owner's identifiers in other systems, such as a Scopus\
    \ Author ID."
  name: External identifiers
- description: Summaries of every activity section in one read.
  name: Activities
- description: "Research outputs, such as articles, datasets and software."
  name: Works
- description: "Grants, awards and other funding."
  name: Fundings
- description: Affiliations of type education.
  name: Education
- description: Affiliations of type employment.
  name: Employment
- description: Affiliations of type qualification.
  name: Qualification
- description: Affiliations of type invited position.
  name: Invited position
- description: Affiliations of type distinction.
  name: Distinction
- description: Affiliations of type membership.
  name: Membership
- description: Affiliations of type service.
  name: Service
- description: "Peer review activity, grouped by the group ID of what was reviewed."
  name: Peer reviews
- description: "Facilities, collections and other resources the record owner used."
  name: Research resources
- description: Public details of an API client.
  name: Clients
- description: Search the registry with Solr query syntax.
  name: Search
- description: The external identifier types the registry accepts.
  name: Identifiers
paths:
  /v3.0/client/{client_id}:
    get:
      operationId: viewClient
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
          pattern: "[^/]+"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/ClientSummary"
            application/xml:
              schema:
                $ref: "#/components/schemas/ClientSummary"
          description: Fetch client details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: "The token is unknown, expired or revoked. The token is optional,\
            \ but a bad one is refused."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "No record has this iD, or no item has this put-code (error\
            \ 9016)."
      summary: Fetch a client's details
      tags:
      - Clients
  /v3.0/csv-search:
    get:
      operationId: searchByQueryCSV
      parameters:
      - description: Offset of the first result (0-based).
        in: query
        name: start
        schema:
          type: integer
          format: int64
      - description: Number of results to return (maximum 1000).
        in: query
        name: rows
        schema:
          type: integer
          format: int64
      - description: "Comma-separated fields to return, for example `orcid,given-names,family-name`."
        in: query
        name: fl
        schema:
          type: string
      - description: "Solr query, for example `family-name:Carberry` or `doi-self:10.1087/20120404`."
        in: query
        name: q
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
          description: "One row per result, with the requested fields"
        "400":
          content:
            text/csv:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The start or rows parameter is out of range (rows 1,000 at\
            \ most; start 10,000 at most without a token)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: "The token is unknown, expired or revoked. The token is optional,\
            \ but a bad one is refused."
      summary: Search records
      tags:
      - Search
  /v3.0/expanded-search:
    get:
      operationId: expandedSearchByQuery
      parameters:
      - description: Offset of the first result (0-based).
        in: query
        name: start
        schema:
          type: integer
          format: int64
      - description: Number of results to return (maximum 1000).
        in: query
        name: rows
        schema:
          type: integer
          format: int64
      - description: "Solr query, for example `family-name:Carberry` or `doi-self:10.1087/20120404`."
        in: query
        name: q
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
            application/xml:
              schema:
                $ref: "#/components/schemas/ExpandedSearch"
          description: "Matching records with their names, emails and institutions"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The start or rows parameter is out of range (rows 1,000 at\
            \ most; start 10,000 at most without a token)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: "The token is unknown, expired or revoked. The token is optional,\
            \ but a bad one is refused."
      summary: Search records
      tags:
      - Search
  /v3.0/identifiers:
    get:
      description: "The identifier types the registry accepts in `external-id-type`,\
        \ such as `doi` or `isbn`, with how each one resolves."
      operationId: viewIdentifierTypes
      parameters:
      - description: "Locale for the descriptions, for example `en` or `fr`. Defaults\
          \ to `en`."
        in: query
        name: locale
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentifierType"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentifierType"
          description: Every identifier type
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: "The token is unknown, expired or revoked. The token is optional,\
            \ but a bad one is refused."
      summary: Fetch the external identifier types
      tags:
      - Identifiers
  /v3.0/search:
    get:
      operationId: searchByQuery
      parameters:
      - description: Offset of the first result (0-based).
        in: query
        name: start
        schema:
          type: integer
          format: int64
      - description: Number of results to return (maximum 1000).
        in: query
        name: rows
        schema:
          type: integer
          format: int64
      - description: "Solr query, for example `family-name:Carberry` or `doi-self:10.1087/20120404`."
        in: query
        name: q
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/Search"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/Search"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/Search"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/Search"
            application/xml:
              schema:
                $ref: "#/components/schemas/Search"
          description: The iDs of the matching records
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
            application/xml:
              schema:
                $ref: "#/components/schemas/OrcidError"
          description: "The start or rows parameter is out of range (rows 1,000 at\
            \ most; start 10,000 at most without a token)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: "The token is unknown, expired or revoked. The token is optional,\
            \ but a bad one is refused."
      summary: Search records
      tags:
      - Search
  /v3.0/{orcid}:
    get:
      operationId: viewRecord
      parameters:
      - description: "ORCID iD of the record, for example `0000-0002-1825-0097`."
        in: path
        name: orcid
        required: true
        schema:
          type: string
          pattern: "^(\\d{4}-){3}\\d{3}[\\dX]$"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
            application/ld+json:
              schema:
                type: object
                description: Schema.org JSON-LD
            application/orcid+json:
              schema:
                $ref: "#/components/schemas/Record"
            application/orcid+xml:
              schema:
                $ref: "#/components/schemas/Record"
            application/vnd.orcid+json:
              schema:
                $ref: "#/components/schemas/Record"
            application/vnd.orcid+xml:
              schema:
                $ref: "#/components/schemas/Record"
            application/xml:
              schema:
                $ref: "#/components/schemas/Record"
          description: Fetch record details
        "301":
          content:
            application/json:
